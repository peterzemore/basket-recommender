[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basket-recommender"
version = "0.1.0"
description = "Item-to-item basket completion on a real retail store's orders, with an honest offline evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
pull = ["requests>=2.31"]
serve = ["fastapi>=0.115", "uvicorn>=0.30", "requests>=2.31", "jinja2>=3.1"]
dev = ["pytest>=8", "httpx2", "fastapi>=0.115", "jinja2>=3.1"]

[project.scripts]
recsys = "recsys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recsys = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
